site_name: dhis2w-fhir
site_description: FHIR for DHIS2 - Implementation Guide generation, the FHIR facade and capture UI, and the FHIRPath / CQL evaluation engine.
site_url: https://winterop-com.github.io/dhis2w-fhir/
repo_url: https://github.com/winterop-com/dhis2w-fhir
repo_name: winterop-com/dhis2w-fhir
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.share
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_category_heading: true
            members_order: source
            heading_level: 2

nav:
  - Overview: index.md
  - Introduction: 100-introduction.md
  - Features: features.md
  - 101 - Understand:
      - Glossary: glossary.md
      - What and why: 101-what-and-why.md
      - FHIR for DHIS2 people: 101-fhir-concepts.md
      - Quickstart: 101-quickstart.md
  - 201 - Operate a project:
      - Run a secured facade: 201-run-a-secured-facade.md
      - Check an instance with doctor: 201-doctor.md
      - Set up a project: 201-set-up-a-project.md
      - Validate an instance: 201-validate.md
      - Generate the IG source: 201-generate.md
      - Build and publish the guide: 201-build-and-publish.md
      - Build a registry and a guide: 201-registry-and-guide.md
      - Publish the registry as a package: 201-registry-package.md
      - Serve the guide: 201-serve.md
      - Secure the facade: 201-secure.md
      - Capture in the browser: 201-capture-ui.md
      - Forward captures into DHIS2: 201-forward.md
      - Troubleshooting: 201-troubleshooting.md
  - 301 - Configure fhir.toml:
      - The settings file: 301-fhir-toml.md
      - Identity - profile and ig: 301-identity.md
      - What goes in - selection: 301-what-goes-in.md
      - How things are generated: 301-generation.md
      - Serving: 301-serving.md
  - 401 - Integrate and extend:
      - The capture contract: 401-capture-contract.md
      - Consume the FHIR API: 401-consume-the-fhir-api.md
      - Embed the facade: 401-embed-the-facade.md
      - Build your own facade: 401-build-your-own-facade.md
      - Identifiers and extensions: 401-identifiers-and-extensions.md
      - Terminology and ConceptMaps: 401-terminology-and-conceptmaps.md
      - Custom subject types: 401-custom-subject-types.md
      - Regeneration and hand-authoring: 401-regeneration-and-hand-authoring.md
  - 501 - Evaluate:
      - FHIRPath: 501-fhirpath.md
      - CQL: 501-cql.md
